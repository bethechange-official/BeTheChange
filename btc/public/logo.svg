<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" fill="none">
  <!-- Botanical circle ornament -->
  <circle cx="40" cy="40" r="30" stroke="#111111" stroke-width="1"/>
  <circle cx="40" cy="40" r="24" stroke="#111111" stroke-width="0.5"/>
  <!-- Tree trunk -->
  <line x1="40" y1="55" x2="40" y2="68" stroke="#111111" stroke-width="1.5"/>
  <!-- Tree branches -->
  <line x1="40" y1="48" x2="28" y2="36" stroke="#111111" stroke-width="1"/>
  <line x1="40" y1="44" x2="52" y2="34" stroke="#111111" stroke-width="1"/>
  <line x1="40" y1="52" x2="30" y2="44" stroke="#111111" stroke-width="0.8"/>
  <line x1="40" y1="50" x2="50" y2="42" stroke="#111111" stroke-width="0.8"/>
  <!-- Leaves -->
  <circle cx="26" cy="34" r="4" fill="#111111"/>
  <circle cx="53" cy="32" r="4" fill="#111111"/>
  <circle cx="40" cy="26" r="5" fill="#111111"/>
  <circle cx="29" cy="42" r="3" fill="#111111"/>
  <circle cx="51" cy="40" r="3" fill="#111111"/>
  <!-- Brand text -->
  <text x="80" y="36" font-family="Georgia, serif" font-size="13" fill="#111111" letter-spacing="2">BE THE</text>
  <text x="80" y="54" font-family="Georgia, serif" font-size="13" fill="#111111" letter-spacing="2">CHANGE</text>
  <!-- Decorative line -->
  <line x1="80" y1="58" x2="160" y2="58" stroke="#111111" stroke-width="0.5"/>
</svg>
