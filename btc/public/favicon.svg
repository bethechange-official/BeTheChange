<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <rect width="80" height="80" rx="16" fill="#111111"/>
  <!-- Botanical circle ornament -->
  <circle cx="40" cy="40" r="30" stroke="#FAF9F6" stroke-width="1.2"/>
  <circle cx="40" cy="40" r="25" stroke="#FAF9F6" stroke-width="0.6"/>
  <!-- Tree trunk -->
  <line x1="40" y1="53" x2="40" y2="64" stroke="#FAF9F6" stroke-width="1.8"/>
  <!-- Tree branches -->
  <line x1="40" y1="46" x2="29" y2="35" stroke="#FAF9F6" stroke-width="1.2"/>
  <line x1="40" y1="42" x2="51" y2="33" stroke="#FAF9F6" stroke-width="1.2"/>
  <line x1="40" y1="50" x2="31" y2="42" stroke="#FAF9F6" stroke-width="1"/>
  <line x1="40" y1="48" x2="49" y2="40" stroke="#FAF9F6" stroke-width="1"/>
  <!-- Leaves -->
  <circle cx="27" cy="33" r="4" fill="#FAF9F6"/>
  <circle cx="52" cy="31" r="4" fill="#FAF9F6"/>
  <circle cx="40" cy="25" r="5" fill="#FAF9F6"/>
  <circle cx="30" cy="41" r="3" fill="#FAF9F6"/>
  <circle cx="50" cy="39" r="3" fill="#FAF9F6"/>
</svg>