name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'btc/**'

permissions:
  contents: read

jobs:
  deploy:
    name: Build & Deploy Frontend to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: btc/package-lock.json
      - name: Install & Build
        working-directory: btc
        run: |
          npm ci
          npm run build
        env:
          VITE_API_URL: https://api.bethechangeorga.com/api
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: btc
          command: pages deploy dist --project-name=bethechange --commit-dirty=true --skip-caching
