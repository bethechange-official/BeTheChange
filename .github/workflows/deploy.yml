name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'btc/**'
      - 'backend/**'

jobs:
  deploy-backend:
    name: Deploy Backend to VPS
    runs-on: ubuntu-latest
    steps:
      - name: SSH & Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/bethechange
            git pull origin main
            cd backend
            npm install
            npx prisma generate
            npx prisma migrate deploy
            npm run build
            pm2 restart btc-backend

  deploy-frontend:
    name: Deploy Frontend to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: btc/package-lock.json
      - name: Install & Build
        working-directory: btc
        run: |
          npm install
          npm run build
        env:
          VITE_API_URL: https://api.bethechangeorga.com
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy btc/dist --project-name=bethechange --commit-dirty=true
