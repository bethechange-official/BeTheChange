name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'btc/**'
      - 'backend/**'

permissions:
  contents: read

jobs:
  build-backend:
    name: Build & Validate Backend
    runs-on: ubuntu-latest
    if: |
      contains(join(github.event.commits.*.modified, ','), 'backend/') ||
      contains(join(github.event.commits.*.added, ','), 'backend/')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Audit dependencies
        working-directory: backend
        run: npm audit --audit-level=high
      - name: Install & Build
        working-directory: backend
        run: |
          npm ci
          npx prisma generate
          npm run build

  deploy-backend:
    name: Deploy Backend to VPS
    runs-on: ubuntu-latest
    needs: build-backend
    permissions:
      contents: read
    steps:
      - name: SSH & Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/bethechange
            git pull origin main
            cd backend
            npm ci
            npx prisma generate
            npx prisma migrate deploy
            npm run build
            pm2 restart btc-backend

  build-frontend:
    name: Build & Validate Frontend
    runs-on: ubuntu-latest
    if: |
      contains(join(github.event.commits.*.modified, ','), 'btc/') ||
      contains(join(github.event.commits.*.added, ','), 'btc/')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: btc/package-lock.json
      - name: Audit dependencies
        working-directory: btc
        run: npm audit --audit-level=high
      - name: Install & Build
        working-directory: btc
        run: |
          npm ci
          npm run build
        env:
          VITE_API_URL: https://api.bethechangeorga.com/api

  deploy-frontend:
    name: Deploy Frontend to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: build-frontend
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: btc/package-lock.json
      - name: Install & Build
        working-directory: btc
        run: |
          npm ci
          npm run build
        env:
          VITE_API_URL: https://api.bethechangeorga.com/api
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: btc
          command: pages deploy dist --project-name=bethechange --commit-dirty=true --skip-caching
