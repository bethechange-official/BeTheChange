services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ${BACKEND_ENV_FILE:-./backend/.env.production}
    environment:
      NODE_ENV: production
      PORT: 5000
      STORAGE_PATH: /data/uploads
    volumes:
      - ${UPLOADS_HOST_PATH:-/var/lib/bethechange/uploads}:/data/uploads
    expose:
      - "5000"

  frontend:
    build:
      context: ./btc
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
